name: Deploy to Replit

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Replit rebuild
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.REPLIT_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"site":"myeventmcp"}' \
            https://myeventqr.com/api/webhook/rebuild
